name: Review and promote Beta to stable
on:
  workflow_dispatch:
    inputs:
      beta_tag:
        description: Published Beta tag to review (e.g. v0.5.4-beta.1)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: stable-promotion
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0'
      - run: sdkmanager 'build-tools;35.0.0'
      - name: Verify candidate package, signature, SHA-256 and source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BETA_TAG: ${{ inputs.beta_tag }}
        run: |
          python app/release.py inspect "$BETA_TAG" > candidate.json
          echo '### Candidate awaiting your review' >> "$GITHUB_STEP_SUMMARY"
          cat candidate.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-candidate
          path: candidate.json
          retention-days: 30
  promote:
    needs: inspect
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0'
      - run: sdkmanager 'build-tools;35.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-candidate
      - name: Promote the exact approved APK
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ENVIRONMENT: production
        run: python app/release.py promote candidate.json
