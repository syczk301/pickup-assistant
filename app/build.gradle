plugins {
 id 'com.android.application' version '8.7.3'
 id 'org.jetbrains.kotlin.android' version '2.1.20'
}
android {
 namespace 'com.local.pickup'
 compileSdk 35
 defaultConfig { applicationId 'com.local.pickup'; minSdk 26; targetSdk 34; versionCode 15; versionName '0.5.0' }
 sourceSets { main { manifest.srcFile 'AndroidManifest.xml'; java.srcDirs = ['src']; res.srcDirs = ['res'] } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
 kotlinOptions { jvmTarget = '1.8' }
}
