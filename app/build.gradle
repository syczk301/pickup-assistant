plugins {
 id 'com.android.application' version '8.7.3'
 id 'org.jetbrains.kotlin.android' version '2.1.20'
}
android {
 namespace 'com.local.pickup'
 compileSdk 35
 defaultConfig { applicationId 'com.local.pickup'; minSdk 26; targetSdk 34; versionCode 30; versionName '0.5.13' }
 sourceSets { main { manifest.srcFile 'AndroidManifest.xml'; java.srcDirs = ['src']; res.srcDirs = ['res'] } }
 sourceSets { main { assets.srcDirs = ['build/ocr-assets']; jniLibs.srcDirs = ['build/ocr-jni'] } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
 kotlinOptions { jvmTarget = '1.8' }
}
tasks.register('prepareOcr', Exec) { commandLine 'python', 'ocr_dependencies.py' }
tasks.named('preBuild').configure { dependsOn 'prepareOcr' }
dependencies { implementation files('build/ocr-runtime/ocr.jar') }
